<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow More - Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">GM</div>
                <h1 class="font-bold text-base text-slate-900">Grow More <span class="text-xs font-normal text-slate-500 ml-1">Admin Panel</span></h1>
            </div>
            <div class="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-medium">100% Free Direct Upload</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Add/Edit Product Form -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
                <h2 id="formTitle" class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4 pb-2 border-b border-slate-100">Add New Product</h2>
                <form id="productForm" class="space-y-3.5">
                    <input type="hidden" id="existingImageUrl">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Product Name</label>
                        <input type="text" id="name" placeholder="jaise Fast Charger 33W" required class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-600 focus:border-indigo-600">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Price</label>
                            <input type="text" id="price" placeholder="Rs. 1,500" required class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-600 focus:border-indigo-600">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Category</label>
                            <select id="category" class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-600 focus:border-indigo-600 bg-white">
                                <option value="Chargers">Chargers</option>
                                <option value="Cables">Cables</option>
                                <option value="AirPods">AirPods</option>
                                <option value="Accessories">Accessories</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Select Picture from Laptop <span id="imgNote" class="text-[10px] text-slate-400">(Choose File)</span></label>
                        <input type="file" id="imageFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-300 rounded-lg cursor-pointer bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
                        <textarea id="description" rows="2" placeholder="Product ki tafseel..." class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-600 focus:border-indigo-600 resize-none"></textarea>
                    </div>
                    
                    <div class="flex space-x-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2 rounded-lg transition duration-150 shadow-sm">
                            Save Product to Store
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm px-4 py-2 rounded-lg transition duration-150">
                            Cancel
                        </button>
                    </div>
                </form>
            </section>

            <!-- Right Column: Product List Table -->
            <section class="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">Store Inventory</h2>
                    <span id="productCount" class="text-xs text-slate-500 font-medium">0 items</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-xs font-semibold text-slate-500 bg-slate-50">
                                <th class="p-2.5">Product</th>
                                <th class="p-2.5">Category</th>
                                <th class="p-2.5">Price</th>
                                <th class="p-2.5 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productList" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-6 text-slate-400 text-xs">Loading products...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <!-- Firebase SDKs & Free Direct Upload Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZY_JWXwvcOEqnZwDe7BeotkqFAuMQHfU",
            authDomain: "grow-more-79cee.firebaseapp.com",
            projectId: "grow-more-79cee",
            storageBucket: "grow-more-79cee.firebasestorage.app",
            messagingSenderId: "846392258273",
            appId: "1:846392258273:web:bc72adf2a763b0de6551a0",
            measurementId: "G-50QFYC084G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('productForm');
        const productList = document.getElementById('productList');
        const productCount = document.getElementById('productCount');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        let editingId = null;

        // Add or Update Product
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = editingId ? 'Updating...' : 'Uploading Image & Saving...';

            try {
                const fileInput = document.getElementById('imageFile');
                const file = fileInput.files[0];
                let imageUrl = document.getElementById('existingImageUrl').value;

                if (file) {
                    const formData = new FormData();
                    formData.append('reqtype', 'fileupload');
                    formData.append('fileToUpload', file);

                    const uploadRes = await fetch('https://catbox.moe/user/api.php', {
                        method: 'POST',
                        body: formData
                    });

                    if (!uploadRes.ok) {
                        throw new Error('Image upload fail ho gayi!');
                    }

                    imageUrl = await uploadRes.text(); // Direct free image URL
                } else if (!editingId && !imageUrl) {
                    throw new Error('Barah-e-karam product ki tasweer select karein!');
                }

                const productData = {
                    name: document.getElementById('name').value,
                    price: document.getElementById('price').value,
                    category: document.getElementById('category').value,
                    image: imageUrl,
                    description: document.getElementById('description').value,
                };

                if (editingId) {
                    productData.updatedAt = new Date();
                    await updateDoc(doc(db, "products", editingId), productData);
                    alert('Product kamyabi se update ho gaya!');
                } else {
                    productData.createdAt = new Date();
                    await addDoc(collection(db, "products"), productData);
                    alert('Product aur image kamyabi se save ho gaye!');
                }

                resetForm();
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = editingId ? 'Update Product' : 'Save Product to Store';
            }
        });

        // Real-time Fetch Products
        onSnapshot(collection(db, "products"), (snapshot) => {
            productList.innerHTML = '';
            productCount.textContent = `${snapshot.size} items`;

            if (snapshot.empty) {
                productList.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400 text-xs">No products found. Add your first product!</td></tr>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const prod = docSnap.data();
                const id = docSnap.id;
                const name = (prod.name || '').replace(/'/g, "&#39;");
                const price = (prod.price || '').replace(/'/g, "&#39;");
                const category = (prod.category || 'Chargers').replace(/'/g, "&#39;");
                const description = (prod.description || '').replace(/'/g, "&#39;");
                const image = prod.image || '';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-2.5 flex items-center space-x-3">
                        <img src="${image}" alt="" class="w-9 h-9 object-cover rounded-md bg-slate-100 border border-slate-200" onerror="this.src='https://via.placeholder.com/40'">
                        <div>
                            <p class="font-medium text-slate-900 text-xs">${prod.name || ''}</p>
                            <p class="text-[11px] text-slate-400 truncate max-w-xs">${prod.description || ''}</p>
                        </div>
                    </td>
                    <td class="p-2.5 text-xs text-slate-600 font-medium"><span class="bg-slate-100 px-2 py-0.5 rounded text-[11px]">${prod.category || ''}</span></td>
                    <td class="p-2.5 text-xs font-semibold text-indigo-600">${prod.price || ''}</td>
                    <td class="p-2.5 text-right space-x-1">
                        <button onclick="editProduct('${id}', '${name}', '${price}', '${category}', '${description}', '${image}')" class="text-indigo-600 hover:text-indigo-800 p-1.5 rounded-lg hover:bg-indigo-50 transition-colors" title="Edit">
                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                        <button onclick="deleteProduct('${id}')" class="text-slate-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition-colors" title="Delete">
                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                productList.appendChild(tr);
            });
        });

        // Edit Product Setup
        window.editProduct = function(id, name, price, category, description, image) {
            editingId = id;
            document.getElementById('name').value = name;
            document.getElementById('price').value = price;
            document.getElementById('category').value = category;
            document.getElementById('description').value = description;
            document.getElementById('existingImageUrl').value = image;

            formTitle.textContent = 'Edit Product';
            submitBtn.textContent = 'Update Product';
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Reset Form Function
        window.resetForm = function() {
            editingId = null;
            form.reset();
            document.getElementById('existingImageUrl').value = '';
            formTitle.textContent = 'Add New Product';
            submitBtn.textContent = 'Save Product to Store';
            cancelEditBtn.classList.add('hidden');
        };

        // Delete Product Function
        window.deleteProduct = async function(id) {
            if (confirm('Kya aap is product ko delete karna chahte hain?')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                } catch (error) {
                    alert('Error deleting: ' + error.message);
                }
            }
        };
    </script>
</body>
</html>
